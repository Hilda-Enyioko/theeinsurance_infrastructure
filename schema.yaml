      - gender
      - last_name
      - password
      - phone_number
    DocumentTypeEnum:
      enum:
      - claim_form
      - police_report
      - drivers_licence
      - damage_photos
      - repair_estimate
      - vehicle_particulars
      - medical_report
      - hospital_bills
      - property_irregularity_report
      - flight_documents
      - travel_insurance_certificate
      - other
      type: string
      description: |-
        * `claim_form` - Completed Claim Form
        * `police_report` - Police Report
        * `drivers_licence` - Driver's Licence
        * `damage_photos` - Damage Photographs
        * `repair_estimate` - Repair Estimate from Garage
        * `vehicle_particulars` - Vehicle Particulars
        * `medical_report` - Medical Report
        * `hospital_bills` - Hospital Bills and Receipts
        * `property_irregularity_report` - Property Irregularity Report
        * `flight_documents` - Flight Tickets and Boarding Pass
        * `travel_insurance_certificate` - Travel Insurance Certificate
        * `other` - Other Supporting Document
    GenderEnum:
      enum:
      - male
      - female
      - other
      type: string
      description: |-
        * `male` - Male
        * `female` - Female
        * `other` - Other
    InitiatePaymentRequest:
      type: object
      description: |-
        Validates a payment initiation request and creates a PENDING Transaction.

        Ensures:
          - The subscription exists and belongs to the requesting user
          - The subscription is in a payable state (PENDING or EXPIRED)
          - No duplicate PENDING transaction already exists for this subscription
          - Amount is pulled from the subscription's plan (not trusted from client)
      properties:
        subscription_id:
          type: string
          format: uuid
        payment_type:
          $ref: '#/components/schemas/PaymentTypeEnum'
      required:
      - payment_type
      - subscription_id
    InsurancePlan:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 500
        provider:
          type: string
          format: uuid
        provider_name:
          type: string
          readOnly: true
        category:
          type: string
          format: uuid
        category_name:
          type: string
          readOnly: true
        coverage_level:
          $ref: '#/components/schemas/PlanCoverageLevelEnum'
        coverage_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
        premium:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
        duration_months:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        description:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - category
      - category_name
      - coverage_amount
      - coverage_level
      - created_at
      - description
      - duration_months
      - id
      - name
      - premium
      - provider
      - provider_name
      - updated_at
    InsurancePlanCreateRequest:
