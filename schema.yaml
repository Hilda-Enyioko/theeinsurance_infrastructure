        description: The target API client_id hash key string.
        required: true
      tags:
      - Staff Service Account Infrastructure Management
      security:
      - jwtAuth
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
          description: ''
        '404':
          content:
            application/json:
              schema:
                description: Target identifier string matched no active record.
          description: ''
  /api/v1/staff/service-accounts/create/:
    post:
      operationId: staff_service_accounts_create_create
      description: Staff-only endpoint to provision system service accounts (e.g.,
        n8n, runtime schedulers). The raw client_secret is returned ONLY once in this
        response and cannot be recovered if lost.
      summary: Provision Machine-to-Machine Service Account
      tags:
      - Staff Service Account Infrastructure Management
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  example: n8n automation workflows
      security:
      - jwtAuth
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  client_id:
                    type: string
                  client_secret:
                    type: string
                    description: Returned once only.
                  name:
                    type: string
                  warning:
                    type: string
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Name field missing.
          description: ''
        '409':
          content:
            application/json:
              schema:
                description: Service account with a matching generated routing identifier
                  already exists.
          description: ''
  /api/v1/subscriptions/:
    get:
      operationId: subscriptions_list
      description: Allows a customer to view their active or past policy subscriptions.
      summary: List Customer Subscriptions
      parameters:
      - in: query
        name: status
        schema:
          type: string
        description: Filter subscriptions by status (e.g., active, pending_payment,
          cancelled)
      tags:
      - subscriptions
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PolicySubscription'
          description: ''
  /api/v1/subscriptions/{subscription_id}/:
    get:
      operationId: subscriptions_retrieve
      description: Fetch explicit object properties of a given customer subscription
        instance.
      summary: Retrieve Subscription Detail
      parameters:
      - in: path
        name: subscription_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - subscriptions
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicySubscription'
          description: ''
    delete:
      operationId: subscriptions_destroy
      description: Transition an active subscription directly into a 'cancelled' status.
      summary: Cancel Subscription
      parameters:
      - in: path
        name: subscription_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - subscriptions
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/subscriptions/{subscription_id}/documents/:
    get:
      operationId: subscriptions_documents_retrieve
      description: Returns lists of uploaded, required, and missing documentation
        statuses.
      summary: View Subscription Document Checklist
      parameters:
      - in: path
        name: subscription_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - subscriptions
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    post:
      operationId: subscriptions_documents_create
      description: Uploads a single file required for the subscription evaluation.
      summary: Upload Subscription Document
      parameters:
      - in: path
        name: subscription_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - subscriptions
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                document_type:
                  type: string
                  description: The code representing the document requirement.
                file:
                  type: string
                  format: binary
                  description: The physical file payload.
              required:
              - document_type
              - file
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/subscriptions/{subscription_id}/verify-payment/:
    post:
      operationId: subscriptions_verify_payment_create
      description: Submit gateway confirmation hashes to transition status out of
        pending_payment and into active.
      summary: Verify Payment Reference
      parameters:
      - in: path
        name: subscription_id
        schema:
          type: string
          format: uuid
