        required document uploads.
      summary: Initiate a Subscription
      tags:
      - subscriptions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicySubscriptionCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PolicySubscriptionCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PolicySubscriptionCreateRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/webhooks/service/register/:
    get:
      operationId: webhooks_service_register_retrieve
      description: Retrieve all webhook configurations specifically registered for
        the calling service account (e.g., n8n).
      summary: List service account webhooks
      tags:
      - webhooks
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    post:
      operationId: webhooks_service_register_create
      description: Upsert webhook URLs for payment lifecycle events driven by internal
        service accounts.
      summary: Register or update service webhooks
      tags:
      - webhooks
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                webhooks:
                  type: array
                  items:
                    type: object
                    properties:
                      event:
                        type: string
                        example: payment.successful
                      url:
                        type: string
                        format: uri
                        example: https://n8n.internal/webhook/payment-success
                    required:
                    - event
                    - url
              required:
              - webhooks
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
components:
  schemas:
    Claim:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        claim_reference:
          type: string
          readOnly: true
        subscription:
          type: string
          format: uuid
        plan_name:
          type: string
          readOnly: true
        customer:
          type: string
          format: uuid
          readOnly: true
        customer_email:
          type: string
          format: email
          readOnly: true
        provider:
          type: string
          format: uuid
          readOnly: true
        provider_name:
          type: string
          readOnly: true
        claim_type:
          $ref: '#/components/schemas/ClaimTypeEnum'
        incident_date:
          type: string
          format: date
        incident_description:
          type: string
        claimed_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        approved_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/ClaimStatusEnum'
          readOnly: true
        theeinsurance_review_note:
          type: string
          readOnly: true
        provider_review_note:
          type: string
          readOnly: true
        documents:
          type: array
          items:
            $ref: '#/components/schemas/ClaimDocument'
          readOnly: true
        submitted_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - approved_amount
      - claim_reference
      - claim_type
      - claimed_amount
      - customer
      - customer_email
      - documents
      - id
      - incident_date
      - incident_description
      - plan_name
      - provider
      - provider_name
      - provider_review_note
      - status
      - submitted_at
      - subscription
      - theeinsurance_review_note
      - updated_at
    ClaimCreateRequest:
      type: object
      properties:
        subscription_id:
          type: string
          format: uuid
        claim_type:
          $ref: '#/components/schemas/ClaimTypeEnum'
        incident_date:
          type: string
          format: date
        incident_description:
          type: string
          minLength: 1
        claimed_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
      required:
      - claim_type
      - claimed_amount
      - incident_date
      - incident_description
      - subscription_id
    ClaimDocument:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        document_type:
          $ref: '#/components/schemas/DocumentTypeEnum'
        file:
          type: string
          format: uri
        uploaded_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - document_type
      - file
      - id
      - uploaded_at
    ClaimDocumentsChecklistResponse:
      type: object
      properties:
        required_documents:
          type: array
          items:
            type: string
        uploaded_documents:
          type: array
          items:
            $ref: '#/components/schemas/ClaimDocument'
        missing_documents:
          type: array
          items:
            type: string
      required:
      - missing_documents
      - required_documents
      - uploaded_documents
    ClaimDocumentsUploadResponse:
      type: object
      properties:
        required_documents:
          type: array
          items:
            type: string
        uploaded_documents:
          type: array
          items:
            $ref: '#/components/schemas/ClaimDocument'
        missing_documents:
          type: array
          items:
            type: string
      required:
      - missing_documents
      - required_documents
      - uploaded_documents
    ClaimStatusEnum:
      enum:
      - submitted
      - under_review
      - more_info_required
      - approved
      - rejected
      type: string
      description: |-
        * `submitted` - Submitted
        * `under_review` - Under Review
        * `more_info_required` - More Information Required
        * `approved` - Approved
        * `rejected` - Rejected
    ClaimTypeEnum:
      enum:
      - motor_accident
      - motor_theft
      - travel_medical
      - travel_baggage
      - travel_cancellation
      type: string
      description: |-
        * `motor_accident` - Motor Accident
        * `motor_theft` - Motor Theft
        * `travel_medical` - Travel Medical Emergency
        * `travel_baggage` - Travel Lost/Damaged Baggage
        * `travel_cancellation` - Travel Flight Cancellation
    CustomerKYC:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        id_type:
          $ref: '#/components/schemas/CustomerKYCTypeEnum'
        id_number:
          type: string
          maxLength: 50
        id_document:
          type: string
          format: uri
        selfie:
          type: string
          format: uri
        status:
          allOf:
          - $ref: '#/components/schemas/KYCReviewStatusEnum'
          readOnly: true
        submitted_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - id_document
      - id_number
      - id_type
      - status
      - submitted_at
    CustomerKYCRequest:
      type: object
      properties:
        id_type:
          $ref: '#/components/schemas/CustomerKYCTypeEnum'
        id_number:
          type: string
          minLength: 1
          maxLength: 50
        id_document:
          type: string
          format: binary
        selfie:
          type: string
          format: binary
      required:
      - id_document
      - id_number
      - id_type
    CustomerKYCTypeEnum:
      enum:
      - nin
      - bvn
      - passport
      - drivers_licence
      - voters_card
      type: string
      description: |-
        * `nin` - National Identity Number
        * `bvn` - Bank Verification Number
        * `passport` - International Passport
        * `drivers_licence` - Driver's Licence
        * `voters_card` - Voter's Card
    CustomerRegistrationRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
        confirm_password:
          type: string
          writeOnly: true
          minLength: 1
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100
        phone_number:
          type: string
          minLength: 1
        date_of_birth:
          type: string
          format: date
        gender:
          $ref: '#/components/schemas/GenderEnum'
