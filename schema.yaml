        customer:
          type: string
          format: uuid
          readOnly: true
        customer_email:
          type: string
          readOnly: true
        plan:
          type: string
          format: uuid
        plan_name:
          type: string
          readOnly: true
        provider:
          type: string
          format: uuid
          readOnly: true
        provider_name:
          type: string
          readOnly: true
        distributor:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        distributor_name:
          type: string
          readOnly: true
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        status:
          allOf:
          - $ref: '#/components/schemas/SubscriptionStatusEnum'
          readOnly: true
        amount_paid:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
          readOnly: true
        provider_payout:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
          readOnly: true
        distributor_commission:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
          readOnly: true
        platform_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
          readOnly: true
        payment_reference:
          type: string
          readOnly: true
          nullable: true
        payment_verified:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        auto_charge_enabled:
          type: boolean
      required:
      - amount_paid
      - created_at
      - customer
      - customer_email
      - distributor
      - distributor_commission
      - distributor_name
      - end_date
      - id
      - payment_reference
      - payment_verified
      - plan
      - plan_name
      - platform_fee
      - provider
      - provider_name
      - provider_payout
      - start_date
      - status
      - updated_at
    PolicySubscriptionCreateRequest:
      type: object
      properties:
        plan_id:
          type: string
          format: uuid
          writeOnly: true
        start_date:
          type: string
          format: date
      required:
      - plan_id
      - start_date
    SubscriptionStatusEnum:
      enum:
      - active
      - expired
      - cancelled
      - failed
      - grace_period
      - lapsed
      - pending_payment
      - pending_document
      type: string
      description: |-
        * `active` - Active
        * `expired` - Expired
        * `cancelled` - Cancelled
        * `failed` - Failed
        * `grace_period` - Grace Period
        * `lapsed` - Lapsed
        * `pending_payment` - Pending Payment
        * `pending_document` - Pending Document
    Transaction:
      type: object
      description: |-
        Read-only serializer for returning Transaction state to the frontend.
        Used in the callback view and any transaction detail/list endpoints.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        reference:
          type: string
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        currency:
          type: string
          readOnly: true
        payment_type:
          allOf:
          - $ref: '#/components/schemas/PaymentTypeEnum'
          readOnly: true
        payment_status:
          allOf:
          - $ref: '#/components/schemas/PaymentStatusEnum'
          readOnly: true
        gateway_reference:
          type: string
          readOnly: true
          nullable: true
        subscription_id:
          type: string
          format: uuid
          readOnly: true
        initiated_by:
          type: string
          nullable: true
          description: Return the email of the user who initiated the transaction.
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - created_at
      - currency
      - gateway_reference
      - id
      - initiated_by
      - payment_status
      - payment_type
      - reference
      - subscription_id
      - updated_at
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
