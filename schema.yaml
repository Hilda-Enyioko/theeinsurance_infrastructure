openapi: 3.0.3
info:
  title: TheeInsurance API
  version: 1.0.0
  description: A headless, API-first insurance distribution platform. Companies integrate
    TheeInsurance into their products via API and offer insurance plans to their customers
    without building the insurance layer themselves.
paths:
  /api/v1/auth/kyc/:
    get:
      operationId: auth_kyc_retrieve
      description: Allows an authenticated consumer to inspect their background check
        and identity records inside the scope of the current partner.
      summary: Retrieve Customer KYC Details
      tags:
      - Customer Management
      security:
      - jwtAuth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerKYC'
          description: ''
        '404':
          content:
            application/json:
              schema:
                description: Customer profile or KYC records not found.
          description: ''
    post:
      operationId: auth_kyc_create
      description: Allows registered consumers to submit required verification and
        identification metrics.
      summary: Submit Customer KYC
      tags:
      - Customer Management
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomerKYCRequest'
        required: true
      security:
      - jwtAuth
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: KYC already submitted or validation errors.
          description: ''
        '404':
          content:
            application/json:
              schema:
                description: Customer profile not found within the current tenant
                  scope.
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Verifies credentials for customers and partner admins, returning
        signed authentication payloads appended with role authorizations and multi-tenant
        scoping claims.
      summary: Shared Portal Authentication Login
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens:
                    type: object
                    properties:
                      refresh:
                        type: string
                      access:
                        type: string
                  role:
                    type: string
                  email:
                    type: string
                    format: email
                  first_name:
                    type: string
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Validation errors.
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Invalid email or password.
          description: ''
        '403':
          content:
            application/json:
              schema:
                description: Account is inactive.
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: Uses tenant context attached to the request (via upstream middleware
        parsing) to bind the newly registered customer account to the parent organization.
      summary: Customer Registration
      tags:
      - Customer Management
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRegistrationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomerRegistrationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomerRegistrationRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  tokens:
                    type: object
                    properties:
                      refresh:
                        type: string
                      access:
                        type: string
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Validation errors.
          description: ''
  /api/v1/auth/service-account/token/:
    post:
      operationId: auth_service_account_token_create
      description: Client-credentials authentication style token mapping workspace.
        Handshakes inbound script applications using signed tokens back-dropped from
        initial custom-issued out-of-band credential mappings.
      summary: Service Account M2M Token Exchange
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - client_id
              - client_secret
              properties:
                client_id:
                  type: string
                client_secret:
                  type: string
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  access:
                    type: string
                  refresh:
                    type: string
                  expires_in:
                    type: integer
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Missing client credentials parameters.
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Invalid secret pairing credentials, or service node disabled.
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: Validates submitted refresh states to hand out fresh access hashes,
        shielding downstream views from re-authentication requirements.
      summary: Refresh Access Token
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - refresh
              properties:
                refresh:
                  type: string
                  description: The refresh token string.
      security:
      - jwtAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  access:
                    type: string
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Refresh token is missing.
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Token is invalid or expired.
          description: ''
  /api/v1/categories/:
    get:
      operationId: categories_retrieve
      description: |-
        Public. Returns all active insurance categories.
        Protected at middleware level via X-Partner-Key.
      summary: List active insurance categories
      tags:
      - categories
      security:
      - jwtAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: A list of active categories.
  /api/v1/claims/:
    get:
      operationId: claims_list
      description: Retrieves a list of all insurance claims submitted by the authenticated
        customer for the active partner.
      summary: List Customer Claims
      tags:
      - Customer Claims
      security:
      - jwtAuth
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Claim'
          description: ''
        '404':
          content:
            application/json:
              schema:
                description: Customer profile not found for this partner context.
          description: ''
    post:
      operationId: claims_create
      description: Submits a new insurance claim against an active policy subscription.
        Returns required document types for the specific claim.
      summary: Submit New Claim
      tags:
      - Customer Claims
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClaimCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClaimCreateRequest'
        required: true
      security:
      - jwtAuth
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Claim submitted. Please upload supporting documents.
                  claim_id:
                    type: string
                    format: uuid
                  claim_reference:
                    type: string
                    example: CLM-12345678
                  required_documents:
                    type: array
                    items:
                      type: string
                    example:
                    - MEDICAL_REPORT
                    - RECEIPT
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Validation error or subscription mismatch.
          description: ''
        '404':
          content:
            application/json:
              schema:
                description: Customer profile or Subscription context not found.
          description: ''
  /api/v1/claims/{claim_id}/:
    get:
      operationId: claims_retrieve
      description: Retrieves granular details of a single claim owned by the authenticated
        customer.
      summary: Get Customer Claim Detail
      parameters:
      - in: path
        name: claim_id
        schema:
          type: string
          format: uuid
        description: UUID of the claim
        required: true
      tags:
      - Customer Claims
      security:
      - jwtAuth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
          description: ''
        '404':
          content:
            application/json:
              schema:
                description: Claim or customer profile context not found.
          description: ''
  /api/v1/claims/{claim_id}/documents/:
    get:
      operationId: claims_documents_retrieve
      description: Fetches a list of uploaded supporting elements, required checklist
        guidelines, and remaining documents for processing validation.
      summary: View Uploaded Claim Documents Checklist
      parameters:
      - in: path
        name: claim_id
        schema:
          type: string
          format: uuid
        description: UUID of the claim
        required: true
      tags:
      - Claim Documents
      security:
      - jwtAuth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimDocumentsChecklistResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                description: Claim contextual workspace profile missing.
          description: ''
    post:
      operationId: claims_documents_create
      description: Uploads a required multi-part file attachment for a pending claim.
        Only allowed while claim is in 'submitted' status.
      summary: Upload Claim Document
      parameters:
      - in: path
        name: claim_id
        schema:
          type: string
          format: uuid
        description: UUID of the claim
        required: true
      tags:
      - Claim Documents
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - document_type
              - file
              properties:
                document_type:
                  type: string
                  description: The exact document classification type identifier.
                file:
                  type: string
                  format: binary
                  description: File attachment payload.
      security:
      - jwtAuth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimDocumentsUploadResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Missing file elements or document validation type failure.
          description: ''
        '404':
          content:
            application/json:
              schema:
                description: Claim not found or closed for documentation entries.
          description: ''
  /api/v1/partner/analytics/distributor/subscriptions-trends/:
    get:
      operationId: partner_analytics_distributor_subscriptions_trends_retrieve
      description: Returns month-on-month breakdown of customer conversions and corresponding
        commissions earned.
      summary: Get Distributor Facilitation Trends
      tags:
      - Analytics - Distributor
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  trends:
                    type: array
                    items:
                      type: object
                      properties:
                        month:
                          type: string
                          example: 2026-06
                        count:
                          type: integer
                          example: 145
                        commissions:
                          type: string
                          example: '145000.00'
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Unauthorized access.
          description: ''
        '403':
          content:
            application/json:
              schema:
                description: Permission denied. Requires Distributor Admin privileges.
          description: ''
  /api/v1/partner/analytics/distributor/summary/:
    get:
      operationId: partner_analytics_distributor_summary_retrieve
      description: Calculates and returns metrics for the authenticated partner distributor,
        including total policies sold, commissions earned, user acquisition count,
        and performance segmented by top insurance providers.
      summary: Get Distributor Analytics Summary
      tags:
      - Analytics - Distributor
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    type: object
                    properties:
                      total_policies_facilitated:
                        type: integer
                        example: 820
                      total_commissions_earned:
                        type: string
                        example: '820000.00'
                      total_customers:
                        type: integer
                        example: 750
                  top_providers:
                    type: array
                    items:
                      type: object
                      properties:
                        provider__name:
                          type: string
                          example: Leadway Assurance
                        total_sold:
                          type: integer
                          example: 500
                  top_plans:
                    type: array
                    items:
                      type: object
                      properties:
                        plan__name:
                          type: string
                          example: Third Party Premium
                        plan__category__name:
                          type: string
                          example: Auto
                        total_sold:
                          type: integer
                          example: 380
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Unauthorized access.
          description: ''
        '403':
          content:
            application/json:
              schema:
                description: Permission denied. Requires Distributor Admin privileges.
          description: ''
  /api/v1/partner/analytics/provider/subscriptions-trends/:
    get:
      operationId: partner_analytics_provider_subscriptions_trends_retrieve
      description: Returns month-on-month aggregations of volumes and revenue generated
        over time.
      summary: Get Provider Subscription Trends
      tags:
      - Analytics - Provider
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  trends:
                    type: array
                    items:
                      type: object
                      properties:
                        month:
                          type: string
                          example: 2026-06
                        count:
                          type: integer
                          example: 240
                        revenue:
                          type: string
                          example: '1200000.00'
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Unauthorized access.
          description: ''
        '403':
          content:
            application/json:
              schema:
                description: Permission denied. Requires Provider Admin privileges.
          description: ''
  /api/v1/partner/analytics/provider/summary/:
    get:
      operationId: partner_analytics_provider_summary_retrieve
      description: Calculates and returns aggregated metrics for the authenticated
        insurance provider, including total revenue, payouts, subscription status
        breakdown, top-performing plans, and performance across different distributors.
      summary: Get Provider Analytics Summary
      tags:
      - Analytics - Provider
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    type: object
                    properties:
                      total_policies:
                        type: integer
                        example: 1540
                      total_revenue:
                        type: string
                        example: '7700000.00'
                      total_payout:
                        type: string
                        example: '6160000.00'
                  status_breakdown:
                    type: array
                    items:
                      type: object
                      properties:
                        status:
                          type: string
                          example: active
                        count:
                          type: integer
                          example: 1200
                  top_plans:
                    type: array
                    items:
                      type: object
                      properties:
                        plan__name:
                          type: string
                          example: Comprehensive Auto Shield
                        total_sold:
                          type: integer
                          example: 450
                        revenue:
                          type: string
                          example: '2250000.00'
                  distributor_breakdown:
                    type: array
                    items:
                      type: object
                      properties:
                        distributor__name:
                          type: string
                          example: Nomba Finance
                        total_sold:
                          type: integer
                          example: 310
                        commission:
                          type: string
                          example: '310000.00'
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Unauthorized access.
          description: ''
        '403':
          content:
            application/json:
              schema:
                description: Permission denied. Requires Provider Admin privileges.
          description: ''
  /api/v1/partner/claims/:
    get:
      operationId: partner_claims_list
      description: Enables authorized provider insurance account administrators to
        view claims targeted at their specific products.
      summary: Provider List Claims
      parameters:
      - in: query
        name: claim_type
        schema:
          type: string
        description: Filter claims by explicit category type identifier
      - in: query
        name: status
        schema:
          type: string
        description: Filter claims by current workflow status state
      tags:
      - Provider Claim Management
      security:
      - jwtAuth
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Claim'
          description: ''
  /api/v1/partner/claims/{claim_id}/:
    get:
      operationId: partner_claims_retrieve
      description: Fetches a dedicated isolated operational view summary of an inbound
        claim for underwriting assessment.
      summary: Provider Claim Details View
      parameters:
      - in: path
        name: claim_id
        schema:
          type: string
          format: uuid
        description: UUID of target claim
        required: true
      tags:
      - Provider Claim Management
      security:
      - jwtAuth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
          description: ''
        '404':
          content:
            application/json:
              schema:
                description: Claim reference data not found within provider administration
                  domain.
          description: ''
    patch:
      operationId: partner_claims_partial_update
      description: Allows a provider underwriting expert to approve, reject, or comment
        on an active claim entry.
      summary: Provider Claim Review Action Evaluation
      parameters:
      - in: path
        name: claim_id
        schema:
          type: string
          format: uuid
        description: UUID of target claim
        required: true
      tags:
      - Provider Claim Management
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedClaimReviewRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedClaimReviewRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedClaimReviewRequest'
      security:
      - jwtAuth
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Claim approved.
                  claim_reference:
                    type: string
                    example: CLM-48218414
                  status:
                    type: string
                    example: approved
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Invalid decision metadata structures or invalid input
                  constraints.
          description: ''
        '404':
          content:
            application/json:
              schema:
                description: Claim context target key missing.
          description: ''
  /api/v1/partner/kyc/:
    get:
      operationId: partner_kyc_retrieve
      description: Allows authenticated corporate administrators to pull down their
        own current KYC submission state.
      summary: Retrieve Partner KYC Status
      tags:
      - Partner Management
      security:
      - jwtAuth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerKYC'
          description: ''
        '404':
          content:
            application/json:
              schema:
                description: No KYC documentation submitted yet.
          description: ''
    post:
      operationId: partner_kyc_create
      description: Allows corporate administrators to upload operational documentation
        for corporate review.
      summary: Submit Partner KYC
      tags:
      - Partner Management
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PartnerKYCRequest'
        required: true
      security:
      - jwtAuth
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: KYC already submitted or validation errors.
          description: ''
  /api/v1/partner/onboard/:
    post:
      operationId: partner_onboard_create
      description: Accepts corporate registration parameters, spins up an inactive
        Partner profile, and issues an API key for subsequent configuration steps.
      summary: Self-register New Partner
      tags:
      - Partner Management
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerOnboardingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PartnerOnboardingRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PartnerOnboardingRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  partner_id:
                    type: string
                    format: uuid
                  api_key:
                    type: string
                    description: Shown once only.
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Validation errors.
          description: ''
  /api/v1/partner/plans/:
    get:
      operationId: partner_plans_retrieve
      description: |-
        Provider admins manage their own plans.
        IsProviderAdmin enforces: authenticated + partner_admin + provider type.
        No inline role checks needed.
      summary: 'Provider Admin: List managed plans'
      parameters:
      - in: query
        name: status
        schema:
          type: string
        description: 'Filter by status: ''active'' or ''inactive'''
      tags:
      - partner
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          description: List of insurance plans for the authenticated provider.
    post:
      operationId: partner_plans_create
      description: |-
        Provider admins manage their own plans.
        IsProviderAdmin enforces: authenticated + partner_admin + provider type.
        No inline role checks needed.
      summary: 'Provider Admin: Create a new plan'
      tags:
      - partner
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InsurancePlanCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InsurancePlanCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InsurancePlanCreateRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsurancePlan'
          description: ''
        '400':
          description: Validation error data.
  /api/v1/partner/plans/{plan_id}/:
    get:
      operationId: partner_plans_retrieve_by_id
      description: |-
        Provider admins retrieve, update, or soft-delete their own plans.
        IsProviderAdmin enforces role at the class level.
        Object ownership is enforced via provider=partner filter in get_object().
      summary: 'Provider Admin: Retrieve a managed plan details'
      parameters:
      - in: path
        name: plan_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - partner
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsurancePlan'
          description: ''
        '404':
          description: Plan not found.
    patch:
      operationId: partner_plans_partial_update
      description: |-
        Provider admins retrieve, update, or soft-delete their own plans.
        IsProviderAdmin enforces role at the class level.
        Object ownership is enforced via provider=partner filter in get_object().
      summary: 'Provider Admin: Partially update a plan'
      parameters:
      - in: path
        name: plan_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - partner
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedInsurancePlanCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedInsurancePlanCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedInsurancePlanCreateRequest'
      security:
