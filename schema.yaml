        '502':
          content:
            application/json:
              schema:
                description: Gateway error.
          description: ''
  /api/v1/payments/interswitch/webhook/:
    post:
      operationId: payments_interswitch_webhook_create
      description: Receives server-to-server transaction status notifications from
        Interswitch. Requires an 'x-interswitch-signature' header. Always returns
        a 200 OK to stop retries.
      summary: Interswitch Server Webhook
      parameters:
      - in: header
        name: x-interswitch-signature
        schema:
          type: string
        description: HMAC-SHA512 signature of the raw request body.
        required: true
      tags:
      - Webhooks
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Webhook received successfully (outcome is logged asynchronously).
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Missing signature or invalid JSON payload.
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Invalid signature verification failure.
          description: ''
  /api/v1/payments/nomba/checkout/:
    post:
      operationId: payments_nomba_checkout_create
      description: Creates a Nomba checkout order for a pending subscription. Requires
        explicit customer consent to automated charges. Returns a checkout link for
        the partner to redirect their customer to.
      summary: Initiate Nomba Checkout
      tags:
      - Payments
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - subscription_id
              - customer_consented
              properties:
                subscription_id:
                  type: string
                  format: uuid
                  description: UUID of the PolicySubscription in pending_payment status.
                customer_consented:
                  type: boolean
                  description: Must be true. Confirms customer agreed to automated
                    renewal charges.
      security:
      - jwtAuth
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  checkout_link:
                    type: string
                  order_reference:
                    type: string
                  transaction_ref:
                    type: string
                  amount:
                    type: string
                  currency:
                    type: string
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Validation error or subscription not in correct state.
          description: ''
        '500':
          content:
            application/json:
              schema:
                description: Gateway error.
          description: ''
  /api/v1/payments/nomba/renewal/charge/:
    post:
      operationId: payments_nomba_renewal_charge_create
      description: Charges a subscription renewal using its stored Nomba tokenized
        card. Called by n8n on renewal dates and dunning retries (day 1, 3, 7). Requires
        service account JWT.
      summary: Trigger auto-renewal charge
      tags:
      - Payments
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - subscription_id
              properties:
                subscription_id:
                  type: string
                  format: uuid
      security:
      - jwtAuth
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  outcome:
                    type: string
                    enum:
                    - success
                    - failed
                  transaction_ref:
                    type: string
                  subscription_id:
                    type: string
                  amount:
                    type: string
                  failure_reason:
                    type: string
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Missing or invalid subscription_id, or business rule
                  violation.
          description: ''
  /api/v1/payments/nomba/webhook/:
    post:
      operationId: payments_nomba_webhook_create
      description: Handles checkout processing updates asynchronously from Nomba.
        Validates authenticity via custom timestamp composite cryptographic headers.
      summary: Nomba Server Webhook
      parameters:
      - in: header
        name: nomba-signature
        schema:
          type: string
        description: HMAC-SHA256 base64 string derived from composite structural context.
        required: true
      - in: header
        name: nomba-timestamp
        schema:
          type: string
        description: Epoch time format token assigned to prevent payload mutation.
        required: true
      tags:
      - Webhooks
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Payload received and verified.
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Missing custom layout headers or semantic parser JSON
                  issues.
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Signature verification engine denied transaction execution
                  context.
          description: ''
